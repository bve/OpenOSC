[platformio]
src_dir = main
default_envs = esp32c3-supermini, esp32c3-recovery

[env]
platform = espressif32@6.13.0
board = esp32-c3-devkitm-1
framework = espidf
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_protocol = custom
upload_command = python -c "raise SystemExit('Flash the USB image made by scripts/build_firmware.py --esp32-only')"

[env:esp32c3-supermini]
board_build.app_partition_name = companion

[env:esp32c3-recovery]
board_build.app_partition_name = factory
board_build.cmake_extra_args = -DOPENOSC_COMPANION_RECOVERY=ON -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.recovery
