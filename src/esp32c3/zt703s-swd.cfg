# Default to the local BLE bridge. OPENOSC_DAP_HOST selects a direct Wi-Fi probe.
bindto 127.0.0.1
adapter driver cmsis-dap
cmsis-dap backend tcp
if {[info exists ::env(OPENOSC_DAP_HOST)]} {
    cmsis-dap tcp host $::env(OPENOSC_DAP_HOST)
} else {
    cmsis-dap tcp host 127.0.0.1
}
cmsis-dap tcp port 4441
transport select swd
adapter speed 500
set WORKAREASIZE 0
source [find target/stm32h7x.cfg]
reset_config none
telnet port disabled
tcl port disabled

# The STM32 debug clock may be gated when attaching in the factory bootloader or Recovery.
stm32h7x.cpu0 configure -event examine-start {
    stm32h7x_dbgmcu_mmw 0x004 0x00600001 0
}
stm32h7x.cpu0 configure -event examine-end {}
