name: Feature request
description: Suggest a new feature or an improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > **One feature or improvement per request.** Open a separate issue for each idea, so that each
        > one can be discussed, planned and closed on its own. A list of unrelated improvements in one
        > issue is hard to track. Group ideas only when they belong to the same feature.

        > [!TIP]
        > **Title:** describe what you would like in a few words. Pick the **Area** below: it is added to the
        > title automatically as `Area: …`, and a trailing period is removed.
        > Examples:
        > - `DMM: Right-align the reading and center OL`
        > - `Scope: Video (PAL/NTSC/SECAM) trigger`
        > - `Decoder: Add RS-485 decoding (DMX)`
  - type: checkboxes
    id: single
    attributes:
      label: One request
      options:
        - label: This request describes one feature or improvement, or changes that belong to the same feature.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: The part of OpenOSC the request is for. It becomes the title prefix.
      options:
        - Scope
        - DMM
        - Generator
        - Bode
        - Decoder
        - Screenshots
        - Battery
        - Power
        - Menus
        - UI
        - USB
        - Recovery
        - Storage
        - Hardware
        - Performance
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: Describe the task or measurement you want to solve.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How it could work on the device.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: How you do it today, or other instruments that do it well.
  - type: checkboxes
    id: model
    attributes:
      label: Devices
      options:
        - label: ZT703S
        - label: ZT706S
