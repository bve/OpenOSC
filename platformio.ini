[platformio]
default_envs = recovery, firmware, zt706s_recovery, zt706s_firmware
extra_configs = private/private.ini

[env]
platform = ststm32@19.6.0
platform_packages = toolchain-gccarmnoneeabi@1.120301.0
board = zt703s
custom_openosc_image = recovery
extra_scripts =
    pre:scripts/build.py
    post:scripts/linker_dependencies.py
build_unflags = -O2 -Og
build_flags =
    -Os
    -flto
    -mfloat-abi=hard
    -mfpu=fpv5-d16
    -DSTM32H7B0xx
    -DUSE_HAL_DRIVER
    -DHSE_VALUE=25000000U
    -Wall
    -Wextra
    -Wno-unused-parameter
    -Iinclude
board_build.ldscript = ld/recovery.ld
build_src_filter =
    +<*>
    -<esp32c3/>
    -<application/>
    -<input/>
    -<ui/>
    -<screenshot/>
    -<settings/>
    -<acquisition/>
    -<measurement/>
    -<generator/>
    -<data/>
    -<instrument/>
    -<decode/>
    -<scpi/>
    -<usb/instrument/>
    -<calibration/zero_*>
    -<calibration/gain_*>
    -<calibration/pwm_*>
    -<calibration/interleave_*>

; ZT703S Recovery (second-stage bootloader at 0x08020000), packed into a factory ZTK container.
[env:recovery]

; ZT703S main firmware (firmware.bin and OpenOSC-Firmware-ZT703S.OSC).
[env:firmware]
custom_openosc_image = application
; Keep -Os: global -O2 caused USB EP0 reconnects on ZT703S.
build_flags = ${env.build_flags} -DOPENOSC_APPLICATION=1 -DLV_CONF_INCLUDE_SIMPLE=1
board_build.ldscript = ld/application.ld
build_src_filter =
    +<application/>
    +<platform/>
    +<startup/>
    +<display/>
    +<storage/>
    -<storage/fat/>
    +<input/>
    +<ui/>
    +<screenshot/>
    +<settings/>
    +<calibration/>
    +<acquisition/>
    +<dsp/>
    +<measurement/>
    +<generator/>
    +<data/>
    +<instrument/>
    +<decode/>
    +<scpi/>
    +<usb/instrument/>
    +<usb/low_level.cpp>
    +<usb/pcd_init.cpp>
    +<usb/pcd_callbacks.cpp>
    +<update/crc32.cpp>
lib_deps =
    symlink://vendor/lvgl
    symlink://vendor/arduinojson

; ZT706S: not yet run on hardware.
[env:zt706s_recovery]
extends = env:recovery
board = zt706s

[env:zt706s_firmware]
extends = env:firmware
board = zt706s
; Neither driver has a pin on this board: PA6 is the power key and PC6 the charge status.
build_src_filter =
    ${env:firmware.build_src_filter}
    -<generator/output.cpp>
    -<measurement/dmm/serial_output.cpp>

; Host unit tests: `pio test -e native` (not part of `pio run`). Only hardware-independent sources
; are compiled; the [env] settings for the device builds are overridden here.
[env:native]
platform = native
platform_packages =
extra_scripts =
board_build.ldscript =
test_framework = unity
test_build_src = yes
build_unflags =
build_flags =
    -std=gnu++17
    -DOPENOSC_BOARD=703
    -DUNITY_INCLUDE_DOUBLE
    -Iinclude
    -Wall
    -Wextra
    -Wno-unused-parameter
build_src_filter =
    -<*>
    +<decode/result.cpp>
    +<decode/protocols/types.cpp>
    +<decode/protocols/uart.cpp>
    +<decode/protocols/i2c.cpp>
    +<decode/protocols/spi.cpp>
    +<data/units.cpp>
    +<measurement/dmm/packet.cpp>
    +<measurement/dmm/decoder.cpp>
    +<measurement/dmm/function.cpp>
    +<measurement/dmm/ranges.cpp>
